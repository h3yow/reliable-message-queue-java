spring.application.name=reliable-message-queue-java
server.port=8080

# 本地持久化快照文件
rmq.data-file=data/queue-state.json
# 消费租约超时：超时未 ack 的消息会被重新投递
rmq.lease-millis=30000
# 失败重试指数退避：min(base * 2^(attempt-1), max)
rmq.backoff-base-millis=1000
rmq.backoff-max-millis=30000
# 最大尝试次数，达到后进入死信
rmq.max-attempts=5
# 租约回收扫描周期
rmq.reaper-period-millis=1000
