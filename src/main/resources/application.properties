# ===== 可靠消息队列本地配置（rmq.*） =====
# 本地持久化根目录（JSON Lines 追加日志，写入强制刷盘）
rmq.data-dir=data/rmq
# 默认主题参数（创建主题时可单独指定）
rmq.default-payload-bytes=65536
rmq.default-capacity=100000
rmq.default-partitions=4
# 消费租约：超过该时长未确认，消息可被重新投递
rmq.visibility-timeout=30s
# 最大消费尝试次数（含首次），超过进入死信
rmq.max-attempts=5
# 失败重试指数退避：base * 2^(attempt-1)，封顶 backoff-max
rmq.backoff-base=200ms
rmq.backoff-max=30s
# 租约超时扫描周期
rmq.redelivery-interval-ms=1000
